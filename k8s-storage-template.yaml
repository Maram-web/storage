apiVersion: v1
kind: Namespace
metadata:
  name: user
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: user
  labels:
    app: user-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: marammanai/user-service:__IMAGE_TAG__
          imagePullPolicy: Always
          ports:
            - containerPort: 8089
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://mysql.user.svc.cluster.local:3306/user_db?createDatabaseIfNotExist=true
            - name: SPRING_DATASOURCE_USERNAME
              value: root
            - name: SPRING_DATASOURCE_PASSWORD
              value: root
          readinessProbe:
            httpGet:
              path: /api/user/actuator/health
              port: 8089
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/user/actuator/health
              port: 8089
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: user
spec:
  type: NodePort
  selector:
    app: user-service
  ports:
    - name: http
      port: 8089
      targetPort: 8089
      nodePort: 30091
