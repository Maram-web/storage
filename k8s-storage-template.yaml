apiVersion: v1
kind: Namespace
metadata:
  name: storage
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storage-service
  namespace: storage
  labels:
    app: storage-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: storage-service
  template:
    metadata:
      labels:
        app: storage-service
    spec:
      containers:
        - name: storage-service
          image: marammanai/storage-service:__IMAGE_TAG__
          imagePullPolicy: Always
          ports:
            - containerPort: 8090
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://mysql.user.svc.cluster.local:3306/ceph_storage_service?createDatabaseIfNotExist=true
            - name: SPRING_DATASOURCE_USERNAME
              value: root
            - name: SPRING_DATASOURCE_PASSWORD
              value: root
            - name: CEPH_S3_ENDPOINT
              value: http://rook-ceph-rgw-my-store.rook-ceph.svc.cluster.local
            - name: CEPH_S3_ACCESSKEY
              value: spring-access-key
            - name: CEPH_S3_SECRETKEY
              value: spring-secret-key
            - name: CEPH_S3_BUCKET
              value: my-test-bucket
            - name: CEPH_S3_REGION
              value: us-east-1
          readinessProbe:
            httpGet:
              path: /api/storage/actuator/health
              port: 8090
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/storage/actuator/health
              port: 8090
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: storage-service
  namespace: storage
spec:
  type: NodePort
  selector:
    app: storage-service
  ports:
    - name: http
      port: 8090
      targetPort: 8090
      nodePort: 30095
