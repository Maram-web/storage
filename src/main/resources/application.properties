spring.application.name=storage-service

# Base de donnees (si besoin)
spring.datasource.url=jdbc:mysql://localhost:3306/ceph_storage_service?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Port HTTP
server.port=8090
server.servlet.context-path=/api/storage

# Ceph S3
ceph.s3.endpoint=http://192.168.194.128:30728
ceph.s3.accessKey=spring-access-key
ceph.s3.secretKey=spring-secret-key
ceph.s3.bucket=my-test-bucket
ceph.s3.region=us-east-1

server.error.include-message=always

# Eureka
eureka.client.service-url.defaultZone=http://discovery-service.discovery.svc.cluster.local:8761/eureka/
eureka.instance.prefer-ip-address=true


