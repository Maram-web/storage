spring.application.name=storage-service

spring.datasource.url=jdbc:mysql://mysql.user.svc.cluster.local:3306/ceph_storage_service
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

server.port=8090

# Ceph S3
ceph.s3.endpoint=${CEPH_S3_ENDPOINT}
ceph.s3.accessKey=${CEPH_S3_ACCESSKEY}
ceph.s3.secretKey=${CEPH_S3_SECRETKEY}
ceph.s3.bucket=${CEPH_S3_BUCKET}
ceph.s3.region=${CEPH_S3_REGION}

# Eureka activation
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://discovery-service:8761/eureka
